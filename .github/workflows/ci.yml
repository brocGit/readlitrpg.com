# Checks every pull request and every push to main (DESIGN §4.7, §15.13).
# Renovate pins each action to a commit SHA (helpers:pinGitHubActionDigests).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Local dev vars (the example files; no secrets)
        run: for app in web admin jobs; do cp "apps/$app/.dev.vars.example" "apps/$app/.dev.vars"; done
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Generated Worker types are current
        run: for app in web admin jobs; do (cd "apps/$app" && pnpm exec wrangler types --check); done
      - run: pnpm test
      - name: Script tests
        run: node --test scripts/*.test.mjs
      - name: Quiz drafts validate and stay balanced
        run: node scripts/quiz-tool.mjs check
      - name: Taxonomy is valid, matches TAXONOMY.md, and its generated module is current
        run: node scripts/taxonomy-build.mjs --check
      - name: The classification golden set is valid against the taxonomy
        run: pnpm eval:classify
      - name: Migrations match the schema
        run: |
          pnpm db:generate --name ci-check
          if [ -n "$(git status --porcelain migrations)" ]; then
            echo "::error::The Drizzle schema has changes with no migration. Run pnpm db:generate and commit it."
            git status --porcelain migrations
            exit 1
          fi
      - run: pnpm build
      - name: No high-severity advisories in production dependencies
        run: pnpm audit --prod --audit-level high

  e2e:
    name: Browser sign-in flows
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: for app in web admin jobs; do cp "apps/$app/.dev.vars.example" "apps/$app/.dev.vars"; done
      - name: Local database
        working-directory: apps/web
        run: pnpm exec wrangler d1 migrations apply DB --local --persist-to ../../.wrangler/state
      - run: pnpm --filter @rlr/web build && pnpm --filter @rlr/admin build
      - name: Start both sites
        run: |
          (cd apps/web && pnpm exec astro preview --port 4321 &)
          sleep 8
          (cd apps/admin && pnpm exec astro preview --port 4322 &)
          (cd apps/jobs && pnpm exec wrangler dev --persist-to ../../.wrangler/state --port 8788 --inspector-port 9231 > /tmp/jobs.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -sf http://localhost:4321/healthz && curl -sf http://localhost:4322/healthz && exit 0
            sleep 1
          done
          exit 1
      - name: Reader sign-in (email link, passkey)
        run: pnpm --filter @rlr/web run e2e
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      - name: Owner console and catalog
        run: pnpm --filter @rlr/admin run e2e
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          E2E_JOBS: "1"
